# Desliga o file-watcher do Streamlit: o inspetor de módulos dele tenta ler
# `torch.classes.__path__` e o PyTorch levanta um RuntimeError, poluindo o
# terminal com um traceback gigante (cosmético — a tela funciona normalmente).
# Efeito colateral: editar app.py não recarrega sozinho; reinicie o streamlit.
[server]
fileWatcherType = "none"
