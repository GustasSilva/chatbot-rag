[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-rag-pt"
version = "0.1.0"
description = "Assistente de perguntas e respostas em português cujo núcleo é um front-end de compilador, com modelo de linguagem como plano B"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.23",
    # >=5.6: e a partir dai que CrossEncoder aceita local_files_only, que o
    # carregamento offline do reranker usa. Ver rag.recuperacao.
    "sentence-transformers>=5.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
